.option.wrong .opt-letter { background: #fc8181; color: #fff; }

e Claude Agent SDK agent that both explores an unfamiliar codebase (reading files, tracing call graphs) and generates boilerplate code changes in the same context. As the codebase grows, the agent increasingly proposes changes based on stale or partial exploration because exploration output and generation reasoning compete for the same context budget.", "question": "What is the most effective architectural fix?", "options": [{"letter": "A", "text": "Give the single agent a larger context window so it can hold both exploration output and generation reasoning at once.", "correct": false}, {"letter": "B", "text": "Keep the single agent but add a stricter system prompt instructing it to \"prioritize recent exploration over old exploration.\"", "correct": false}, {"letter": "C", "text": "Split the work into a coordinator that delegates exploration to a specialized subagent and only passes the subagent's distilled findings to a separate step that performs code generation.", "correct": true}, {"letter": "D", "text": "Alternate the single agent between exploration and generation more slowly, one file at a time, so it never explores too much before generating.", "correct": false}], "correct": "C", "explanation": "The root cause is architectural: one agent is juggling two competing jobs (broad exploration and focused generation) inside a single shared context, so exploration output crowds out generation reasoning. The fix is role separation — a coordinator/subagent split where only distilled findings (not raw exploration) cross into the generation step.", "global_n": 2}, {"n": 3, "scenario": "Developer Productivity with Claude", "domain": "D1", "task_statement": "1.6", "scenario_code": "S4", "difficulty": "L3", "situation": "A developer productivity tool always runs the same fixed four-step pipeline for every incoming request: (1) full-repo Grep scan, (2) call-graph trace, (3) generate boilerplate, (4) write tests — regardless of whether the request is a one-line typo fix or  "scenario_code": "S6", "difficulty": "L3", "situation": "A contract-clause extraction system's instructions currently say 'flag any clause that seems risky, but only report the ones you're highly confident about.' Reviewers find this produces inconsistent flagging: similar clauses are sometimes flagged and sometimes not across different documents.", "question": "What change would most improve consistency?", "options": [{"letter": "A", "text": "Keep the current instruction, but add 'be even more conservative' to reduce false positives further.", "correct": false}, {"letter": "B", "text": "Replace the vague guidance with explicit, concrete criteria for what counts as a risky clause (e.g., named categories such as unlimited liability, auto-renewal without notice, unilateral termination), removing the subjective 'highly confident' framing.", "correct": true}, {"letter": "C", "text": "Keep the current instruction, but ask the model to also report a self-reported confidence score alongside each flag so reviewers can filter by confidence.", "correct": false}, {"letter": "D", "text": "Remove the flagging step's autonomy entirely and require the model to flag every clause so nothing is missed, leaving all filtering to human reviewers.", "correct": false}], "correct": "B", "explanation": "Vague qualifiers like 'seems risky' and 'highly confident' give the model no stable basis for consistent judgment. Replacing them with explicit, named criteria is the documented fix for reducing false positives/negatives and improving consistency.", "global_n": 13}, {"n": 14, "scenario": "Structured Data Extraction", "domain": "D4", "task_statement": "4.4", "scenario_code": "S6", "difficulty": "L3", "situation": "When an extraction call returns JSON that fails schema validation (e.g., 'amount' comes back as a string instead of a number), the current retry logic simply resends the same prompt with 'That was invalid, please try again.' This works about half the time and burns extra calls. Sep  "correct": true}, {"letter": "C", "text": "Raise the overall spot-check sampling rate uniformly across all documents so more errors are caught eventually, without changing which document types are sampled.", "correct": false}, {"letter": "D", "text": "Remove handwritten receipts from the pipeline entirely, since they are dragging down the aggregate accuracy number.", "correct": false}], "correct": "B", "explanation": "Aggregate accuracy can mask severe local failures in specific document type/field combinations. The fix is to measure and route review at the type/field level (stratified review), not to keep relying on a single aggregate number or apply a uniform sampling increase.", "global_n": 17}, {"n": 18, "scenario": "Structured Data Extraction", "domain": "D5", "task_statement": "5.6", "scenario_code": "S6", "difficulty": "L3", "situation": "An extraction system consolidates financial figures from three different quarterly source documents (an earnings report, a press release, and a regulatory filing) into a single output record. For one metric, the earnings report and the regulatory filing disagree by a large margin. The current implementation silently picks one value, without noting where it came from, and passes it downstream as the single \"true\" figure.", "question": "What is the most defensible fix?", "options": [{"letter": "A", "text": "Keep picking one value automatically, but always prefer whichever source document was extracted first in processing order.", "correct": false}, {"letter": "B", "text": "Average the two conflicting values so downstream systems get a single reasonable number.", "correct": false}, {"letter": "C", "text": "Preserve a claim-to-source mapping in the output — retain both conflicting values, tag each with its source document, and surface the discrepancy rather than silently resolving it to one number.", "correct": true}, {"letter": "D", "text": "Drop the metric entirely from the output whenever any two sources disagree, to avoid red error distinguishing genuine failure from a legitimate empty result, so it can detect, retry, escalate, or flag the affected documents at the earliest point the failure occurred, rather than silently forwarding empty records downstream.", "global_n": 19}, {"n": 20, "scenario": "Structured Data Extraction", "domain": "D5", "task_statement": "5.2", "scenario_code": "S6", "difficulty": "L3", "situation": "During structured extraction from ambiguous legal documents, the pipeline occasionally hits clauses where two contradictory interpretations are both textually plausible and no schema rule resolves which is correct. The current design has the model pick one interpretation on its own and report a self-generated confidence score, escalating to a human only when its own confidence dips below 70%. Reviewers find several genuinely ambiguous clauses where the model reported 85%+ confidence but picked the wrong interpretation.", "question": "What should change about the escalation trigger?", "options": [{"letter": "A", "text": "Base escalation on structural signals that indicate genuine ambiguity (e.g., detecting that a clause matches more than one mutually exclusive extraction pattern, or that required disambiguating context is missing) rather than relying on the model's self-reported confidence score, which is not a reliable proxy for correctness.", "correct": true}, {"letter": "B", "text": "Increase the self-reported confidence threshold for escalation from 70% to 90%, so more borderline cases get escalated.", "correct": false}, {"letter": "C", "text": "Remove escalation entirely and have a human review every single clause in every document, regardless of ambiguity.", "correct": false}, {"letter": "D", "text": "Keep the self-reported confidence mechanism, but average it with a second independent instance's self-reported confidence before deciding whether to escalate.", "correct": false}], "correct": "A", "explanation": "Self-reported confidence has been shown to be an const state = { current: 0, answers: {} };

function md(text) {
  if (!text) return '';
  return text
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, ' ');
}

function buildSidebar() {
  const list = document.getElementById('sidebarList');
  document.getElementById('totalCount').textContent = QUESTIONS.length;
  let currentScenario = null;
  let groupEl = null;
  QUESTIONS.forEach((q, idx) => {
    if (q.scenario !== currentScenario) {
      currentScenario = q.scenario;
      const sg = document.createElement('div');
      sg.className = 'scenario-group';
      const lbl = document.createElement('div');
      lbl.className = 'scenario-label';
      lbl.textContent = q.scenario;
      sg.appendChild(lbl);
      groupEl = sg;
      list.appendChild(sg);
    }
    const btn = document.createElement('button');
    btn.className = 'q-btn';
    btn.id = 'sb-' + idx;
    btn.onclick = () => goto(idx);
    btn.innerHTML = '<span class="q-dot"></span> Q' + q.global_n;
    groupEl.appendChild(btn);
  });
}

function updateSidebar() {
  QUESTIONS.forEach((q, idx) => {
    const btn = document.getElementById('sb-' + idx);
    if (!btn) return;
    btn.className = 'q-btn';
    if (idx === state.current) btn.classList.add('active');
    const ans = state.answers[q.global_n];
    if (ans !== undefined) {
      btn.classList.add(ans === q.correct ? 'answered-correct' : 'answered-wrong');
    }
  });
  document.getElementById('answeredCount').textContent = Object.keys(state.answers).length;
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  const chosen = state.answers[q.global_n];
  const locked = chosen !== undefined;

  document.getElementById('qCounter').textContent = (idx + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === QUESTIONS.length - 1;

  const optionsHtml = q.options.map(opt => {
    let cls = 'option';
    if (locked) {
      cls += ' locked';
      if (opt.correct) cls += ' correct';
      else if (opt.letter === chosen) cls += ' wrong';
      else cls += ' dimmed';
    }
    return '<div class="' + cls + '" data-letter="' + opt.letter + '" onclick="answer(' + q.global_n + ', \'' + opt.letter + '\')">' +
      '<div class="opt-letter">' + opt.letter + '</div>' +
      '<div class="opt-text">' + md(opt.text) + '</div></div>';
  }).join('');

  const expl = locked
    ? '<div class="explanation show"><strong>Why ' + q.correct + ':</strong> ' + md(q.explanation) + '</div>'
    : '<div class="explanation"></div>';

  const tag = (q.domain ? q.domain : '') + (q.task_statement ? ' · TS ' + q.task_statement : '') + (q.difficulty ? ' · ' + q.difficulty : '');

  document.getElementById('qCard').innerHTML =
    '<div class="q-number">Question ' + q.global_n + '</div>' +
    '<div class="q-scenario">' + q.scenario + '</div>' +
    (tag ? '<div class="q-tag">' + tag + '</div>' : '') +
    '<div class="q-situation">' + md(q.situation) + '</div>' +
    '<div class="q-prompt">' + md(q.question) + '</div>' +
    '<div class="options">' + optionsHtml + '</div>' +
    expl;
}

function answer(globalN, letter) {
  if (state.answers[globalN] !== undefined) return;
  state.answers[globalN] = letter;
  renderQuestion(state.current);
  updateSidebar();
}

function navigate(dir) { goto(state.current + dir); }

function goto(idx) {
  if (idx < 0 || idx >= QUESTIONS.length) return;
  document.getElementById('questionScreen').classList.add('active');
  document.getElementById('summaryScreen').classList.remove('active');
  state.current = idx;
  renderQuestion(idx);
  updateSidebar();
}

function showSummary() {
  document.getElementById('questionScreen').classList.remove('active');
  document.getElementById('summaryScreen').classList.add('active');

  const total = QUESTIONS.length;
  const answered = Object.keys(state.answers).length;
  let correct = 0;
  const wrongByScenario = {};

  QUESTIONS.forEach(q => {
    const ans = state.answers[q.global_n];
    if (ans === undefined) return;
    if (ans === q.correct) {
      correct++;
    } else {
      if (!wrongByScenario[q.scenario]) wrongByScenario[q.scenario] = [];
      wrongByScenario[q.scenario].push({ q: q, chosen: ans });
    }
  });

  const wrong = answered - correct;
  const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
  const unanswered = total - answered;

  let wrongGroupsHtml = '';
  for (const scenario in wrongByScenario) {
    const items = wrongByScenario[scenario];
    const rows = items.map(item => {
      const chosenOpt = item.q.options.find(o => o.letter === item.chosen);
      const correctOpt = item.q.options.find(o => o.letter === item.q.correct);
      return '<div class="wrong-item">' +
        '<div class="wi-n">Q' + item.q.global_n + '</div>' +
        '<div class="wi-q">' +
          '<div class="wi-situation">' + md(item.q.situation) + '</div>' +
          '<div class="wi-prompt">' + md(item.q.question) + '</div>' +
          '<div class="wi-ans">' +
            'Your answer: <span class="wi-wrong-tag">' + item.chosen + '</span> — ' + md(chosenOpt ? chosenOpt.text : '') + '<br>' +
            'Correct: <span class="wi-correct-tag">' + item.q.correct + '</span> — ' + md(correctOpt ? correctOpt.text : '') +
          '</div>' +
        '</div></div>';
    }).join('');
    wrongGroupsHtml +=
      '<div class="group-block">' +
        '<div class="group-title">' + scenario +
          '<span class="group-badge">' + items.length + ' incorrect</span></div>' +
        rows +
      '</div>';
  }

  const unansweredNote = unanswered > 0
    ? '<p style="color:#e53e3e;font-size:14px;margin-bottom:20px;font-weight:600;">&#9888; ' + unanswered + ' question(s) not answered.</p>'
    : '';

  document.getElementById('summaryContent').innerHTML =
    '<h1>Exam Complete</h1>' +
    '<p class="summary-subtitle">You answered ' + answered + ' of ' + total + ' questions.</p>' +
    unansweredNote +
    '<div class="score-grid">' +
      '<div class="score-card total"><div class="big">' + pct + '%</div><div class="label">Score</div></div>' +
      '<div class="score-card correct-c"><div class="big">' + correct + '</div><div class="label">Correct</div></div>' +
      '<div class="score-card wrong-c"><div class="big">' + wrong + '</div><div class="label">Incorrect</div></div>' +
    '</div>' +
    (wrong > 0
      ? '<div class="section-title">Incorrect answers by scenario</div>' + wrongGroupsHtml
      : '<p style="color:#38a169;font-weight:700;font-size:17px;">All answered questions correct!</p>') +
    '<button class="restart-btn" onclick="restart()">Restart Exam</button>' +
    '<button class="restart-btn download-btn" onclick="downloadResults()">Download Results (JSON)</button>' +
    '<button class="restart-btn ai-btn" onclick="downloadAIReport()">Download for AI Analysis (Markdown)</button>' +
    '<div class="download-note">' +
      '<strong>Download Results (JSON)</strong> is a compact machine-readable file for this repo\'s own weakness tracking — ' +
      'save it into <code>' + RESULTS_HINT_PATH + '</code> and the next weakness-focused bank you generate with the <code>cca-f-trainer</code> skill will read every file in that folder.<br><br>' +
      '<strong>Download for AI Analysis (Markdown)</strong> is a self-contained, human-readable write-up (full question text, your answer, the correct answer, and the explanation for every question) meant to be pasted into any AI chat (this one or another) and asked something like "What are my weakest areas and what should I review next?" — no repo access needed on the other end.' +
    '</div>';
}

function downloadResults() {
  const results = QUESTIONS.map(q => {
    const chosen = state.answers[q.global_n];
    return {
      id: q.global_n,
      domain: q.domain || null,
      task_statement: q.task_statement || null,
      scenario: q.scenario_code || null,
      difficulty: q.difficulty || null,
      user_choice: chosen === undefined ? null : chosen,
      correct_choice: q.correct,
      is_correct: chosen === q.correct
    };
  });
  const answeredResults = results.filter(r => r.user_choice !== null);
  const correctCount = answeredResults.filter(r => r.is_correct).length;
  const payload = {
    bank: BANK_NAME,
    generated_at: new Date().toISOString(),
    total: QUESTIONS.length,
    answered: answeredResults.length,
    correct: correctCount,
    results: results
  };
  const ts = payload.generated_at.replace(/[:.]/g, '-');
  triggerDownload(JSON.stringify(payload, null, 2), BANK_NAME + '-results-' + ts + '.json', 'application/json');
}

function stripMd(text) {
  if (!text) return '';
  return text.replace(/`([^`]+)`/g, '$1').replace(/\*\*([^*]+)\*\*/g, '$1');
}

function downloadAIReport() {
  const now = new Date();
  const answered = Object.keys(state.answers).length;
  let correct = 0;
  const byDomain = {};

  const lines = [];
  lines.push('# CCAR-F Practice Review — ' + BANK_NAME);
  lines.push('');
  lines.push('Generated: ' + now.toISOString());
  lines.push('');
  lines.push('This is a self-contained review of a CCAR-F (Claude Certified Architect – Foundations) practice quiz. ' +
    'Each question below includes the full scenario, all answer choices, the choice I picked, the correct choice, and the official explanation. ' +
    'Please analyze my mistakes, identify patterns in what I get wrong (by domain and by the type of reasoning error), and suggest what to review next.');
  lines.push('');

  QUESTIONS.forEach(q => {
    const chosen = state.answers[q.global_n];
    const isAnswered = chosen !== undefined;
    const isCorrect = chosen === q.correct;
    if (isAnswered) {
      if (isCorrect) correct++;
      const d = q.domain || 'Unknown';
      if (!byDomain[d]) byDomain[d] = { correct: 0, total: 0 };
      byDomain[d].total++;
      if (isCorrect) byDomain[d].correct++;
    }

    const tagBits = [];
    if (q.domain) tagBits.push(q.domain);
    if (q.task_statement) tagBits.push('TS ' + q.task_statement);
    if (q.scenario_code) tagBits.push(q.scenario_code);
    if (q.difficulty) tagBits.push(q.difficulty);
    const tag = tagBits.length ? ' (' + tagBits.join(' · ') + ')' : '';
    const status = !isAnswered ? 'UNANSWERED' : (isCorrect ? 'CORRECT' : 'INCORRECT');

    lines.push('## Q' + q.global_n + ' — ' + q.scenario + tag + ' — ' + status);
    lines.push('');
    lines.push('**Situation:** ' + stripMd(q.situation));
    lines.push('');
    lines.push('**Question:** ' + stripMd(q.question));
    lines.push('');
    q.options.forEach(opt => {
      let marker = '';
      if (opt.letter === q.correct && opt.letter === chosen) marker = '  ← your answer (correct)';
      else if (opt.letter === q.correct) marker = '  ← correct answer';
      else if (opt.letter === chosen) marker = '  ← your answer (incorrect)';
      lines.push('- **' + opt.letter + '.** ' + stripMd(opt.text) + marker);
    });
    lines.push('');
    lines.push('**Explanation:** ' + stripMd(q.explanation));
    lines.push('');
    lines.push('---');
    lines.push('');
  });

  const summaryLines = ['## Summary', '', 'Score: ' + correct + ' / ' + answered + ' answered (' + QUESTIONS.length + ' total)', ''];
  summaryLines.push('| Domain | Correct / Answered |');
  summaryLines.push('|---|---|');
  Object.keys(byDomain).sort().forEach(d => {
    summaryLines.push('| ' + d + ' | ' + byDomain[d].correct + ' / ' + byDomain[d].total + ' |');
  });
  summaryLines.push('');

  const report = lines.slice(0, 5).join('\n') + '\n' + summaryLines.join('\n') + '\n' + lines.slice(5).join('\n');

  const ts = now.toISOString().replace(/[:.]/g, '-');
  triggerDownload(report, BANK_NAME + '-ai-review-' + ts + '.md', 'text/markdown');
}

function triggerDownload(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function restart() {
  state.answers = {};
  state.current = 0;
  document.getElementById('questionScreen').classList.add('active');
  document.getElementById('summaryScreen').classList.remove('active');
  renderQuestion(0);
  updateSidebar();
}

buildSidebar();
renderQuestion(0);
updateSidebar();
</script>
